# nginx delante de la app (VPS). Termina HTTPS y reenvía todo a Node en :8787.
# La app ya sirve la web, el fallback de SPA y las redirecciones; aquí se
# repiten las 301 de las URLs antiguas para que respondan sin tocar Node.
# Certificados: `sudo certbot --nginx -d amortoxico.com -d www.amortoxico.com`.
# Mantén las redirecciones sincronizadas con server/static.ts (LEGACY_REDIRECTS).

upstream amor_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name amortoxico.com www.amortoxico.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://amortoxico.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.amortoxico.com;
    ssl_certificate     /etc/letsencrypt/live/amortoxico.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amortoxico.com/privkey.pem;
    return 301 https://amortoxico.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amortoxico.com;

    ssl_certificate     /etc/letsencrypt/live/amortoxico.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amortoxico.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # URLs del sitio anterior
    location = /vsl { return 301 /test$is_args$args; }
    location = /vsl/ { return 301 /test$is_args$args; }
    location = /inicio { return 301 /$is_args$args; }
    location = /home { return 301 /$is_args$args; }
    location = /articulos { return 301 /blog$is_args$args; }
    location = /articulos/ { return 301 /blog$is_args$args; }
    location = /guia { return 301 /guia-72-horas$is_args$args; }
    location = /guia-72h { return 301 /guia-72-horas$is_args$args; }
    location = /test-amor-toxico { return 301 /test$is_args$args; }
    location = /contact { return 301 /contacto$is_args$args; }
    location = /privacy { return 301 /privacidad$is_args$args; }
    location = /politica-de-privacidad { return 301 /privacidad$is_args$args; }
    # /blog/ → /blog (barras finales del sitio anterior)
    location ~ ^(.+)/$ { return 301 $1$is_args$args; }

    # Respuestas del asistente en streaming (SSE): sin búfer.
    location /api/assistant/chat {
        proxy_pass http://amor_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://amor_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
